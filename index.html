<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLICK.CART | Viral Trending Finds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            accent: '#22c55e',
                            neon: '#a855f7'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .whatsapp-glow {
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20">

    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-40 glass-nav px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 p-0.5 flex items-center justify-center">
                        <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center text-indigo-400 font-bold text-lg">
                            <i class="fa-solid me-0.5 fa-cart-shopping"></i>
                        </div>
                    </div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide text-white flex items-center gap-1">
                        CLICK.CART
                        <i class="fa-solid fa-circle-check text-indigo-400 text-xs"></i>
                    </h1>
                    <p class="text-xs text-slate-400">@click.cart_go</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="toggleAdminModal()" title="Owner Admin Panel" class="p-2.5 rounded-full bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 transition text-sm flex items-center gap-1 border border-indigo-500/40">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button onclick="toggleSettingsModal()" title="WhatsApp Settings" class="p-2.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition text-sm flex items-center gap-1 border border-slate-700">
                    <i class="fa-solid fa-gear text-indigo-400"></i>
                </button>
                <a id="headerWhatsappBtn" href="#" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-3 py-2 rounded-full text-xs flex items-center gap-1 whatsapp-glow transition">
                    <i class="fa-brands fa-whatsapp text-sm"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full px-4 pt-4 flex-1">
        
        <!-- Hero Tagline Banner -->
        <div class="glass-card rounded-2xl p-4 mb-5 text-center relative overflow-hidden border border-slate-800">
            <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-[10px] font-semibold bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 mb-2">
                🔥 Trending Instagram Products & Decor
            </span>
            <h2 class="text-lg font-bold text-white mb-1">Viral Aesthetics at Unbeatable Prices</h2>
            <p class="text-xs text-slate-400 mb-2">Instant WhatsApp ordering • All India Fast Delivery</p>
            <button onclick="toggleAdminModal()" class="mt-2 text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-1.5 rounded-full inline-flex items-center gap-1.5 transition">
                <i class="fa-solid fa-circle-plus"></i> Add New Product Now
            </button>
        </div>

        <!-- Search and Category Filters -->
        <div class="mb-5 space-y-3">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Search products, lamps, clocks..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div class="flex gap-2 overflow-x-auto pb-1 text-xs scrollbar-none">
                <button onclick="filterCategory('all')" class="cat-btn active bg-indigo-600 text-white px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap transition">✨ All</button>
                <button onclick="filterCategory('lighting')" class="cat-btn bg-slate-800 text-slate-300 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap border border-slate-700 transition">💡 Lights</button>
                <button onclick="filterCategory('decor')" class="cat-btn bg-slate-800 text-slate-300 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap border border-slate-700 transition">🪴 Decor</button>
                <button onclick="filterCategory('kitchen')" class="cat-btn bg-slate-800 text-slate-300 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap border border-slate-700 transition">🍳 Kitchen</button>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="grid grid-cols-2 gap-3 mb-8" id="productGrid"></div>
    </main>

    <!-- FOOTER -->
    <footer class="max-w-md mx-auto w-full px-4 text-center text-xs text-slate-500 py-6 border-t border-slate-800">
        <p class="mb-2">© 2026 CLICK.CART • All rights reserved</p>
        <button onclick="toggleAdminModal()" class="text-indigo-400 hover:underline">Owner: Add / Manage Products</button>
    </footer>

    <!-- ORDER MODAL WITH 3-IMAGE GALLERY -->
    <div id="orderModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 text-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-white flex items-center gap-2">
                    <i class="fa-brands fa-whatsapp text-emerald-400 text-lg"></i> Complete WhatsApp Order
                </h3>
                <button onclick="closeOrderModal()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-2">
                <div class="w-full h-48 rounded-xl bg-slate-800 overflow-hidden border border-slate-700">
                    <img id="mainModalImage" src="" alt="Product" class="w-full h-full object-cover">
                </div>
                <div id="imageThumbnails" class="grid grid-cols-3 gap-2"></div>
            </div>
            <div>
                <h4 id="modalTitle" class="font-bold text-sm text-white"></h4>
                <p id="modalPrice" class="text-sm text-emerald-400 font-extrabold mt-0.5"></p>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1 font-medium">Quantity</label>
                    <div class="flex items-center gap-3">
                        <button onclick="adjustQty(-1)" class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 font-bold">-</button>
                        <span id="modalQty" class="font-bold text-sm text-white">1</span>
                        <button onclick="adjustQty(1)" class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 font-bold">+</button>
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1 font-medium">Pincode (Optional)</label>
                    <input type="number" id="modalPincode" placeholder="e.g. 400001" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none">
                </div>
            </div>
            <button onclick="proceedToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 whatsapp-glow transition text-sm">
                <i class="fa-brands fa-whatsapp text-lg"></i> Launch WhatsApp Chat
            </button>
        </div>
    </div>

    <!-- OWNER ADMIN PANEL MODAL (ADD NEW PRODUCTS) -->
    <div id="adminModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 text-slate-200 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus text-indigo-400"></i> Owner Product Publisher
                </h3>
                <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="addProductForm" onsubmit="handleAddNewProduct(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Product Title</label>
                    <input type="text" id="newTitle" required placeholder="e.g. Sunset Projection Lamp" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium text-slate-300 mb-1">Price (₹)</label>
                        <input type="number" id="newPrice" required placeholder="399" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-300 mb-1">Original Price (₹)</label>
                        <input type="number" id="newOriginalPrice" required placeholder="899" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium text-slate-300 mb-1">Category</label>
                        <select id="newCategory" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
                            <option value="lighting">Lighting</option>
                            <option value="decor">Decor</option>
                            <option value="kitchen">Kitchen</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-300 mb-1">Badge Tag</label>
                        <input type="text" id="newBadge" placeholder="Best Seller" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
                    </div>
                </div>
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Image URL 1 (Cover photo - ImgBB/Direct Link)</label>
                    <input type="url" id="newImg1" required placeholder="https://i.ibb.co/..." class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
                </div>
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Image URL 2 (Optional)</label>
                    <input type="url" id="newImg2" placeholder="https://..." class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
                </div>
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Image URL 3 (Optional)</label>
                    <input type="url" id="newImg3" placeholder="https://..." class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white">
                </div>
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Short Description</label>
                    <textarea id="newDesc" rows="2" placeholder="Describe the item..." class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white"></textarea>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition text-xs">
                    Publish Product Live
                </button>
            </form>
        </div>
    </div>

    <!-- WHATSAPP SETTINGS MODAL -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 text-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-white flex items-center gap-2"><i class="fa-solid fa-gear text-indigo-400"></i> WhatsApp Settings</h3>
                <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div>
                <label class="block font-medium text-slate-300 mb-1 text-xs">WhatsApp Business Number (with country code)</label>
                <input type="text" id="storePhoneInput" placeholder="919876543210" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm font-mono">
            </div>
            <button onclick="saveStorePhone()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-xl text-xs">Save Number</button>
        </div>
    </div>

    <script>
        // Default initial items
        const defaultProducts = [
            {
                id: 'p1',
                name: 'Butterfly LED Wall Light',
                price: 399,
                originalPrice: 799,
                category: 'lighting',
                badge: 'Best Seller',
                images: [
                    'https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?w=600',
                    'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600',
                    'https://images.unsplash.com/photo-1540932239986-30128078f3c5?w=600'
                ],
                description: 'Aesthetic glowing butterfly decoration light for bedroom walls.'
            }
        ];

        // Load saved products from browser local storage, or fallback to defaults
        let products = JSON.parse(localStorage.getItem('clickcart_custom_products')) || defaultProducts;

        let currentPhone = localStorage.getItem('clickcart_whatsapp') || '919876543210';
        let selectedProduct = null;
        let selectedQty = 1;
        let activeCategory = 'all';

        window.onload = function() {
            document.getElementById('storePhoneInput').value = currentPhone;
            updateHeaderWhatsappLink();
            renderProducts(products);

            document.getElementById('searchInput').addEventListener('input', function(e) {
                const query = e.target.value.toLowerCase();
                const filtered = products.filter(p => 
                    (activeCategory === 'all' || p.category === activeCategory) &&
                    (p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query))
                );
                renderProducts(filtered);
            });
        };

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-8 text-slate-500 text-xs">No products found. Use the Owner Panel to add some!</div>`;
                return;
            }

            items.forEach(product => {
                const discount = Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100);
                const card = document.createElement('div');
                card.className = 'glass-card rounded-xl overflow-hidden flex flex-col border border-slate-800 transition hover:border-slate-700';
                card.innerHTML = `
                    <div class="relative h-36 bg-slate-900 overflow-hidden">
                        <img src="${product.images[0]}" alt="${product.name}" class="w-full h-full object-cover">
                        <span class="absolute top-2 left-2 bg-slate-950/80 backdrop-blur-md text-amber-300 text-[10px] font-bold px-2 py-0.5 rounded-md border border-amber-500/30">${product.badge || 'Hot'}</span>
                        <span class="absolute top-2 right-2 bg-emerald-500 text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded">-${discount}%</span>
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between space-y-2">
                        <div>
                            <h4 class="font-bold text-xs text-slate-100 line-clamp-1">${product.name}</h4>
                            <p class="text-[10px] text-slate-400 line-clamp-2 mt-0.5">${product.description}</p>
                        </div>
                        <div>
                            <div class="flex items-baseline gap-1.5 mb-2">
                                <span class="font-extrabold text-sm text-white">₹${product.price}</span>
                                <span class="text-[10px] text-slate-500 line-through">₹${product.originalPrice}</span>
                            </div>
                            <button onclick='openOrderModal(${JSON.stringify(product)})' class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-semibold py-2 rounded-lg flex items-center justify-center gap-1.5 transition active:scale-95">
                                <i class="fa-brands fa-whatsapp text-sm"></i> Order Now
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            activeCategory = cat;
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => 
                (activeCategory === 'all' || p.category === activeCategory) &&
                (p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query))
            );
            renderProducts(filtered);
        }

        function openOrderModal(product) {
            selectedProduct = product;
            selectedQty = 1;
            document.getElementById('modalQty').innerText = selectedQty;
            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalPrice').innerText = `₹${product.price}`;
            
            const mainImg = document.getElementById('mainModalImage');
            mainImg.src = product.images[0];

            const thumbContainer = document.getElementById('imageThumbnails');
            thumbContainer.innerHTML = '';
            
            product.images.forEach((imgUrl, index) => {
                if (!imgUrl) return;
                const thumb = document.createElement('div');
                thumb.className = `h-14 rounded-lg overflow-hidden border-2 cursor-pointer ${index === 0 ? 'border-indigo-500' : 'border-slate-700'}`;
                thumb.innerHTML = `<img src="${imgUrl}" class="w-full h-full object-cover">`;
                thumb.onclick = function() {
                    mainImg.src = imgUrl;
                    document.querySelectorAll('#imageThumbnails > div').forEach(d => d.className = 'h-14 rounded-lg overflow-hidden border-2 border-slate-700');
                    thumb.className = 'h-14 rounded-lg overflow-hidden border-2 border-indigo-500';
                };
                thumbContainer.appendChild(thumb);
            });

            document.getElementById('orderModal').classList.remove('hidden');
        }

        function closeOrderModal() { document.getElementById('orderModal').classList.add('hidden'); }
        function adjustQty(amount) {
            if (selectedQty + amount >= 1) {
                selectedQty += amount;
                document.getElementById('modalQty').innerText = selectedQty;
            }
        }

        function proceedToWhatsApp() {
            if (!selectedProduct) return;
            const pincode = document.getElementById('modalPincode').value.trim();
            const totalPrice = selectedProduct.price * selectedQty;
            let message = `Hi CLICK.CART! 👋 I would like to order:\n\n📦 *Product:* ${selectedProduct.name}\n🔢 *Quantity:* ${selectedQty}\n💰 *Total Amount:* ₹${totalPrice}\n`;
            if (pincode) message += `📍 *Pincode:* ${pincode}\n`;
            message += `\nPlease confirm availability and send UPI payment details!`;
            window.open(`https://wa.me/${currentPhone}?text=${encodeURIComponent(message)}`, '_blank');
            closeOrderModal();
        }

        // Admin Modal Handler
        function toggleAdminModal() { document.getElementById('adminModal').classList.toggle('hidden'); }
        
        function handleAddNewProduct(e) {
            e.preventDefault();
            const title = document.getElementById('newTitle').value.trim();
            const price = Number(document.getElementById('newPrice').value);
            const originalPrice = Number(document.getElementById('newOriginalPrice').value);
            const category = document.getElementById('newCategory').value;
            const badge = document.getElementById('newBadge').value.trim() || 'Trending';
            const img1 = document.getElementById('newImg1').value.trim();
            const img2 = document.getElementById('newImg2').value.trim();
            const img3 = document.getElementById('newImg3').value.trim();
            const desc = document.getElementById('newDesc').value.trim();

            const newProd = {
                id: 'p_' + Date.now(),
                name: title,
                price: price,
                originalPrice: originalPrice,
                category: category,
                badge: badge,
                images: [img1, img2 || img1, img3 || img1].filter(Boolean),
                description: desc
            };

            products.unshift(newProd); // Add to beginning of array
            localStorage.setItem('clickcart_custom_products', JSON.stringify(products));
            
            renderProducts(products);
            toggleAdminModal();
            document.getElementById('addProductForm').reset();
            alert("Product published live successfully!");
        }

        function toggleSettingsModal() { document.getElementById('settingsModal').classList.toggle('hidden'); }
        function saveStorePhone() {
            const input = document.getElementById('storePhoneInput').value.trim();
            if (input.length >= 8) {
                currentPhone = input.replace(/\+/g, '').replace(/\s/g, '');
                localStorage.setItem('clickcart_whatsapp', currentPhone);
                updateHeaderWhatsappLink();
                toggleSettingsModal();
                alert("WhatsApp number updated!");
            }
        }
        function updateHeaderWhatsappLink() {
            document.getElementById('headerWhatsappBtn').href = `https://wa.me/${currentPhone}?text=${encodeURIComponent("Hi CLICK.CART! I have a question about your products.")}`;
        }
    </script>
</body>
</html>
